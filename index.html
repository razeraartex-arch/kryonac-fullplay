<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KryonAC FullPlay - 3D Replay Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
#canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
canvas { display: block; }

#ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#ui-overlay > * { pointer-events: auto; }

/* Modal Input Token */
#token-input {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8; border-radius: 12px;
    padding: 30px; text-align: center; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
}
#token-input h1 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; font-weight: 700; }
#token-input p { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
#token-input input {
    width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 6px;
    background: #0f172a; color: #fff; font-size: 15px; text-align: center;
    font-family: monospace; letter-spacing: 2px; outline: none;
}
#token-input input:focus { border-color: #38bdf8; }
#token-input button {
    margin-top: 12px; width: 100%; padding: 10px; background: #38bdf8; color: #0f172a;
    border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s;
}
#token-input button:hover { background: #0284c7; color: #fff; }

/* Controlli Inferiori */
#controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(15, 23, 42, 0.95));
    padding: 15px 25px; display: flex; flex-direction: column; gap: 10px;
}
#timeline {
    width: 100%; height: 6px; -webkit-appearance: none; background: #334155;
    border-radius: 3px; outline: none; cursor: pointer;
}
#timeline::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; background: #38bdf8;
    border-radius: 50%; cursor: pointer;
}
#controls-row { display: flex; align-items: center; gap: 10px; }
#controls-row button {
    background: #1e293b; border: 1px solid #334155; color: #38bdf8;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
}
#controls-row button:hover { background: #38bdf8; color: #0f172a; }
#controls-row button.active { background: #0284c7; color: #fff; border-color: #0284c7; }
#time-label { color: #94a3b8; font-size: 12px; font-family: monospace; }
#player-label { color: #38bdf8; font-size: 13px; font-weight: bold; margin-left: 10px; }

/* Pannelli */
#info-panel, #players-list, #chat-panel {
    position: absolute; background: rgba(30, 41, 59, 0.9); border: 1px solid #334155;
    border-radius: 8px; padding: 12px; font-size: 12px; backdrop-filter: blur(4px);
}
#info-panel { top: 15px; right: 15px; width: 260px; max-height: 75vh; overflow-y: auto; }
#players-list { top: 15px; left: 15px; width: 200px; }
#chat-panel { bottom: 90px; left: 15px; width: 300px; max-height: 150px; overflow-y: auto; }

.panel-title { color: #38bdf8; font-size: 13px; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
.info-row { display: flex; justify-content: space-between; margin: 3px 0; }
.info-label { color: #94a3b8; }
.info-value { color: #f8fafc; font-family: monospace; }

.player-entry { padding: 5px; cursor: pointer; border-radius: 4px; margin-bottom: 2px; }
.player-entry:hover { background: rgba(56, 189, 248, 0.1); }
.player-entry.selected { background: rgba(56, 189, 248, 0.2); font-weight: bold; }

#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #38bdf8; font-size: 16px; font-weight: bold; display: none; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-overlay">
    <div id="token-input">
        <h1>KryonAC FullPlay</h1>
        <p>Inserisci il Token Replay per iniziare</p>
        <input type="text" id="token-field" placeholder="Es. a1b2c3d4e5f6" maxlength="12" onkeydown="if(event.key==='Enter') loadReplay()">
        <button onclick="loadReplay()">Carica Replay</button>
        <div id="token-error" style="color:#ef4444; margin-top:8px; font-size:12px;"></div>
    </div>

    <div id="players-list" style="display:none">
        <div class="panel-title">Giocatori</div>
        <div id="players-container"></div>
    </div>

    <div id="info-panel" style="display:none">
        <div class="panel-title" id="info-title">Info Giocatore</div>
        <div class="info-row"><span class="info-label">Mondo</span><span class="info-value" id="info-world">-</span></div>
        <div class="info-row"><span class="info-label">Posizione</span><span class="info-value" id="info-pos">-</span></div>
        <div class="info-row"><span class="info-label">Velocità</span><span class="info-value" id="info-speed">-</span></div>
        <div class="info-row"><span class="info-label">Vita</span><span class="info-value" id="info-hp">-</span></div>
        <div class="info-row"><span class="info-label">Item in Mano</span><span class="info-value" id="info-held">-</span></div>
    </div>

    <div id="chat-panel" style="display:none">
        <div class="panel-title">Chat Log</div>
        <div id="chat-container"></div>
    </div>

    <div id="controls" style="display:none">
        <input type="range" id="timeline" min="0" max="100" value="0" oninput="seekFrame(this.value)">
        <div id="controls-row">
            <button onclick="skip(-100)">⏮</button>
            <button id="play-btn" onclick="togglePlay()">▶</button>
            <button onclick="skip(100)">⏭</button>
            <span id="time-label">00:00</span>
            <span id="player-label">-</span>
            <span style="flex:1"></span>
            <button onclick="changeSpeed()">Velocità: <span id="speed-label">1.0x</span></button>
            <button id="follow-btn" class="active" onclick="toggleFollow()">Segui Camera</button>
        </div>
    </div>

    <div id="loading">Caricamento Replay in corso...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
const FIREBASE_URL = "https://kryonac-fullplay-default-rtdb.europe-west1.firebasedatabase.app";

let scene, camera, renderer, controls;
let replayData = null;
let currentFrame = 0;
let isPlaying = false;
let playSpeed = 1.0;
let followTarget = true;
let selectedPlayer = null;
let playerMeshes = {};
let blockMeshes = [];
const speeds = [0.5, 1.0, 1.5, 2.0];
let speedIdx = 1;

const BLOCK_COLORS = {
    1: 0x808080, 2: 0x557a2b, 3: 0x866043, 4: 0x555555, 5: 0x9c7849, 
    8: 0x2e5c8a, 9: 0x2e5c8a, 10: 0xd05819, 11: 0xd05819, 12: 0xd8d098, 18: 0x2d5e1e
};

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 30);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    window.addEventListener('resize', onResize);
    animate();
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    if (controls) controls.update();

    if (isPlaying && replayData && replayData.frames) {
        currentFrame += playSpeed;
        if (currentFrame >= replayData.frames.length) currentFrame = 0;
        document.getElementById('timeline').value = Math.floor(currentFrame);
        renderFrame(Math.floor(currentFrame));
    }

    renderer.render(scene, camera);
}

async function loadReplay() {
    const token = document.getElementById('token-field').value.trim();
    if (!token) return;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('token-error').textContent = '';

    try {
        const resp = await fetch(`${FIREBASE_URL}/replays/${encodeURIComponent(token)}.json`);
        const data = await resp.json();
        
        if (!data) throw new Error('Replay non trovato o scaduto.');

        replayData = data;
        selectedPlayer = replayData.playerUuid;

        document.getElementById('token-input').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('info-panel').style.display = 'block';
        document.getElementById('players-list').style.display = 'block';
        document.getElementById('chat-panel').style.display = 'block';

        document.getElementById('timeline').max = replayData.frames.length - 1;
        document.getElementById('player-label').textContent = replayData.playerName || 'Player';

        buildWorld();
        updatePlayersList();
        renderFrame(0);
    } catch (e) {
        document.getElementById('token-error').textContent = e.message;
        document.getElementById('loading').style.display = 'none';
    }
}

function buildWorld() {
    blockMeshes.forEach(m => scene.remove(m));
    blockMeshes = [];

    if (!replayData.chunks) return;

    const geo = new THREE.BoxGeometry(1, 1, 1);
    
    replayData.chunks.forEach(chunk => {
        if (!chunk.blocks) return;
        
        const mat = new THREE.MeshLambertMaterial({ color: 0x557a2b });
        const instancedMesh = new THREE.InstancedMesh(geo, mat, chunk.blocks.length);
        const dummy = new THREE.Object3D();
        let count = 0;

        chunk.blocks.forEach((id, idx) => {
            if (id === 0) return;
            const x = (chunk.cx * 16) + (idx % 16);
            const z = (chunk.cz * 16) + Math.floor((idx / 16) % 16);
            const y = Math.floor(idx / 256);

            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(count++, dummy.matrix);
        });

        instancedMesh.instanceMatrix.needsUpdate = true;
        scene.add(instancedMesh);
        blockMeshes.push(instancedMesh);
    });
}

function renderFrame(index) {
    if (!replayData || !replayData.frames[index]) return;

    const frame = replayData.frames[index];
    document.getElementById('time-label').textContent = `${Math.floor(index / 20)}s`;

    Object.keys(playerMeshes).forEach(uuid => {
        scene.remove(playerMeshes[uuid]);
        delete playerMeshes[uuid];
    });

    if (!frame.players) return;

    Object.keys(frame.players).forEach(uuid => {
        const p = frame.players[uuid];
        
        const group = new THREE.Group();
        group.position.set(p.x, p.y, p.z);

        const bodyGeo = new THREE.BoxGeometry(0.6, 1.8, 0.6);
        const bodyMat = new THREE.MeshLambertMaterial({ color: uuid === selectedPlayer ? 0x38bdf8 : 0xef4444 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        group.add(body);

        scene.add(group);
        playerMeshes[uuid] = group;

        if (uuid === selectedPlayer) {
            document.getElementById('info-pos').textContent = `${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)}`;
            document.getElementById('info-speed').textContent = `${(Math.sqrt(p.vx*p.vx + p.vz*p.vz) || 0).toFixed(2)} m/s`;
            document.getElementById('info-hp').textContent = p.hp ? `${p.hp}/20` : '-';
            document.getElementById('info-held').textContent = p.held || 'Mano Vuota';

            if (followTarget) {
                controls.target.set(p.x, p.y + 1, p.z);
            }
        }
    });
}

function updatePlayersList() {
    const container = document.getElementById('players-container');
    container.innerHTML = '';
    if (!replayData.frames[0] || !replayData.frames[0].players) return;

    Object.keys(replayData.frames[0].players).forEach(uuid => {
        const p = replayData.frames[0].players[uuid];
        const div = document.createElement('div');
        div.className = `player-entry ${uuid === selectedPlayer ? 'selected' : ''}`;
        div.textContent = p.name || uuid.substring(0, 8);
        div.onclick = () => {
            selectedPlayer = uuid;
            updatePlayersList();
            renderFrame(Math.floor(currentFrame));
        };
        container.appendChild(div);
    });
}

function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('play-btn').textContent = isPlaying ? '⏸' : '▶';
}

function seekFrame(val) {
    currentFrame = parseInt(val);
    renderFrame(currentFrame);
}

function skip(amount) {
    currentFrame = Math.max(0, Math.min(replayData.frames.length - 1, currentFrame + amount));
    document.getElementById('timeline').value = Math.floor(currentFrame);
    renderFrame(Math.floor(currentFrame));
}

function changeSpeed() {
    speedIdx = (speedIdx + 1) % speeds.length;
    playSpeed = speeds[speedIdx];
    document.getElementById('speed-label').textContent = `${playSpeed.toFixed(1)}x`;
}

function toggleFollow() {
    followTarget = !followTarget;
    document.getElementById('follow-btn').classList.toggle('active', followTarget);
}

init3D();
</script>
</body>
</html>
